[project]
name = "valkey-setup"
version = "0.2.0"
description = "Pinned from-source Valkey builder; container images are the artifact store, the runtime image the product."
readme = "README.md"
authors = [
    { name = "Declan Joseph", email = "declan.obu@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
valkey-setup = "valkey_setup:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "poethepoet>=0.49.0",
]

[tool.poe.tasks]

[tool.poe.tasks.build]
cmd = "valkey-setup build"
help = "Build the core artifact image for a profile"

[tool.poe.tasks.module]
cmd = "valkey-setup module"
help = "Build module artifact images for a profile (--args pass through)"

[tool.poe.tasks.runtime]
cmd = "valkey-setup runtime"
help = "Assemble the runtime image (builds core/modules if missing)"

[tool.poe.tasks.clean]
cmd = "valkey-setup clean --cache"
help = "Remove the podman-side leftover containers and prune cache images"

[tool.poe.tasks.test]
cmd = "pytest"
help = "Run the test suite"

[tool.pytest.ini_options]
testpaths = ["tests"]
